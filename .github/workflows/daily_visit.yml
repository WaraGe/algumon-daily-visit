name: Daily Auto Login Visit

on:
  schedule:
    # 한국 시간(KST) 낮 12시 5분 실행 (UTC 기준 03:05)
    # ※ 밤 자정 12시 5분을 원하시면 '5 15 * * *' 로 수정하세요.
    - cron: '5 3 * * *'
  workflow_dispatch: # 수동 즉시 실행 테스트 버튼

permissions:
  contents: write

jobs:
  visit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Run auto visit script
        env:
          SITE_COOKIES: ${{ secrets.SITE_COOKIES }}
        run: python main.py

      - name: Prevent 60-day inactivity disable
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" = "01" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep workflow active"
            git push
          fi
